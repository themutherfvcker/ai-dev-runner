name: Governed Codex SEO Task

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: governed-codex-seo-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-task:
    if: >-
      github.event.issue.pull_request == null &&
      github.actor == 'themutherfvcker' &&
      startsWith(github.event.comment.body, 'CODEX_TASK:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Parse bounded dispatch
        id: dispatch
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          MANIFEST="$(printf '%s\n' "$COMMENT" | sed -n '1s/^CODEX_TASK:[[:space:]]*//p')"
          case "$MANIFEST" in
            docs/seo/tasks/*.json) ;;
            *) echo "Invalid task manifest path" >&2; exit 2 ;;
          esac
          if [[ "$MANIFEST" == *".."* ]]; then
            echo "Unsafe task manifest path" >&2
            exit 2
          fi
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Checkout deterministic SEO runner
        uses: actions/checkout@v5
        with:
          repository: themutherfvcker/ai-dev-runner
          ref: feat/seo-actions-v2
          path: _seo_runner
          persist-credentials: false

      - name: Relocate runner outside target worktree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seo-runner"
          cp -a _seo_runner/. "$RUNNER_TEMP/seo-runner/"
          rm -rf _seo_runner
          echo "SEO_RUNNER=$RUNNER_TEMP/seo-runner" >> "$GITHUB_ENV"

      - name: Validate task authorization and observation window
        id: contract
        run: |
          python3 "$SEO_RUNNER/scripts/validate_seo_task.py" \
            "${{ steps.dispatch.outputs.manifest }}" \
            --repo "${{ github.repository }}"

      - name: Install project dependencies before Codex
        run: npm ci

      - name: Run disposable Codex implementer
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt-file: ${{ steps.contract.outputs.prompt_file }}
          model: ${{ steps.contract.outputs.model }}
          effort: ${{ steps.contract.outputs.effort }}
          safety-strategy: drop-sudo

      - name: Enforce task scope
        run: python3 "$SEO_RUNNER/scripts/check_scope.py" "${{ steps.dispatch.outputs.manifest }}"

      - name: Build gate
        run: npm run build

      - name: Start candidate site for Four Stars
        if: steps.contract.outputs.four_stars_enabled == 'true'
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/seo-next.log 2>&1 &
          echo $! > /tmp/seo-next.pid
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:3000/', timeout=1)
                  raise SystemExit(0)
              except Exception:
                  time.sleep(0.5)
          raise SystemExit('candidate server did not become ready')
          PY

      - name: Four Stars regression gate
        if: steps.contract.outputs.four_stars_enabled == 'true'
        run: |
          python3 "$SEO_RUNNER/scripts/four_stars_compare.py" \
            --tool-dir "$SEO_RUNNER/tools/four-stars" \
            --baseline-url "${{ steps.contract.outputs.four_stars_production_url }}" \
            --candidate-url "http://127.0.0.1:3000${{ steps.contract.outputs.four_stars_route }}" \
            --keyword "${{ steps.contract.outputs.four_stars_keyword }}" \
            --min-delta "${{ steps.contract.outputs.four_stars_min_delta }}"

      - name: Stop candidate site
        if: always() && steps.contract.outputs.four_stars_enabled == 'true'
        run: |
          if [[ -f /tmp/seo-next.pid ]]; then kill "$(cat /tmp/seo-next.pid)" 2>/dev/null || true; fi

      - name: Commit, push branch and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.contract.outputs.task_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          BRANCH="codex/${TASK_ID}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "${TASK_ID}: Codex implementation"
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin "HEAD:$BRANCH"
          PR_URL="$(gh pr create --draft --base main --head "$BRANCH" --title "${TASK_ID}: governed Codex implementation" --body "Governed Codex implementation for ${TASK_ID}. Mechanical gates passed: scope, build, and Four Stars when enabled. Review the Vercel preview and diff before merge. No auto-merge is configured.")"
          gh issue comment "$ISSUE_NUMBER" --body "${TASK_ID} READY_FOR_REVIEW: ${PR_URL}"
